    <meta name="viewport" content="width=980, height=613, user-scalable=no" />
    <title>Accueil</title>

    <!-- FONCTION CSS -->
    <style type="text/css">
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;

        body {
            background-image: url("accueil.jpg");
            background-size: cover;

            display: block;
            width: 100vw;
            height: 100vh;
            text-decoration: none;
        }

    <script src="/libs/qimessaging/2/qimessaging.js"></script>

<body>
    <!-- Le lien recouvre toute la page, le clic renvoie sur le menu Pepper -->

    </a>
